name: CI & Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  test-and-scan:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Module Checksums
        run: go mod verify

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Compile Cipher CLI
        run: go build -v -o cipher ./cmd/cipher

      - name: Run Cipher Scan & Generate SARIF
        run: ./cipher scan --format sarif --output cipher-results.sarif .

      - name: Upload SARIF to GitHub Security Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: cipher-results.sarif
          category: cipher-static-analysis